name: Research suite
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils qemu-system-x86 python3 curl xz-utils
          rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none
          sh tools/fetch-zig.sh
          echo "$PWD/build/tools/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Build and validate
        run: |
          set -o pipefail
          mkdir -p build
          make test 2>&1 | tee build/test.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-evidence
          path: |
            build/test.log
            build/research/**/*.log
            build/research/*.json
            build/default/zeal.img
            build/research/scenario-20/zeal.img
            build/research/scenario-21/zeal.img
            build/research/scenario-22/zeal.img
            build/research/scenario-23/zeal.img
            build/research/scenario-*/footprint.json
          if-no-files-found: warn
